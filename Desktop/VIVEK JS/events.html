<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label>Enter First No</label>
        <input type="text" name="num1" id="num1"><br/><br/>

        <label>Enter second No</label>
        <input type="text" name="num2" id="num2"><br/><br/>

        <button type="button" onclick="add()">add</button><br/><br/>
        <button type="button" onclick="sub()">sub</button><br/><br/>
        <button type="button" onclick="mul()">mul</button><br/><br/>
        <button type="button" onclick="div()">div</button><br/><br/>

        RESULT: <b id="res"></b>

        <script>
            function add ()
            {
                let no1=document.getElementById("num1").value;
                let no2=document.getElementById("num2").value;
                document.getElementById("res").innerHTML = parseInt(no1)+parseInt(no2)

            }

            function sub ()
            {
                let no1=document.getElementById("num1").value;
                let no2=document.getElementById("num2").value;
                document.getElementById("res").innerHTML = parseInt(no1)-parseInt(no2)

            }

            function mul ()
            {
                let no1=document.getElementById("num1").value;
                let no2=document.getElementById("num2").value;
                document.getElementById("res").innerHTML = parseInt(no1)*parseInt(no2)

            }

            function div ()
            {
                let no1=document.getElementById("num1").value;
                let no2=document.getElementById("num2").value;
                document.getElementById("res").innerHTML = parseInt(no1)/parseInt(no2)

            }


        </script>

    </form>
</body>
</html>
