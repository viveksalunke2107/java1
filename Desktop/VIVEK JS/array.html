<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    


    <script>
          

          let fruits = ["mango","greasp","banana","apple"];
          document.write(fruits,"<br>")

        //   how to accees data outside array
       document.write(fruits[2],"<br>")

    //    hoe to change array values
       fruits[2] = "chikoo"
       document.write(fruits,"<br>")

    //    how to find array lengtl 
          document.write(fruits.length,"<br>")

          //    how to find array size 
          document.write(fruits.length-1,"<br>")

        //   array methods
        // 1.push ():it use to insert values at last of an arraay
       fruits.push("dragan fruit","kivi");
        document.write(fruits,"<br>");

        // 2.pop(): it use to remove values from array at end at time only one element is to be delete
        fruits.pop();
        document.write(fruits,"<br>");

         // 3.unshift ():it use to insert values at from starting  of an arraay
         fruits.unshift("santri","pomogeanate");
        document.write(fruits,"<br>");

         // 4.shift(): it use to remove values from array from starting at time only one element is to be delete
         fruits.shift();
         document.write(fruits,"<br>");

    </script>
</body>
</html>
